name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una PR que recibe varios pushes seguidos solo corre el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Postgres para los tests de integración. Es el mismo servicio que
      # docker-compose.test.yml levanta en local.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roahoki_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roahoki_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y formato
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:55432/roahoki_test

      # Corre al final porque es el paso más lento: si el lint o los tests
      # fallan, no tiene sentido esperar el build.
      - name: Build
        run: npm run build
        env:
          # Valores de relleno: el build no consulta la base, pero necesita que
          # las variables existan para no fallar al resolverlas.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          ADMIN_PASSWORD: ci-admin-password
